name: SolaceCore
version: 'Alpha-v1.1.0'
main: com.etmisthefox.solacecore.SolaceCore
api-version: '1.21'
authors: [ EtmisTheFox ]
description: SolaceCore — Lightweight moderation and admin tools for Minecraft servers
website: https://etmisthefox.com
permissions:
  solacecore.kick:
    default: op
  solacecore.ban:
    default: op
  solacecore.ipban:
    default: op
  solacecore.tempban:
    default: op
  solacecore.tempipban:
    default: op
  solacecore.unban:
    default: op
  solacecore.mute:
    default: op
  solacecore.tempmute:
    default: op
  solacecore.unmute:
    default: op
  solacecore.warn:
    default: op
  solacecore.warns:
    default: op
  solacecore.banprotection:
    default: op
  solacecore.kickprotection:
    default: op
  solacecore.muteprotection:
    default: op
  solacecore.menu:
    default: op
  solacecore.reload:
    default: op